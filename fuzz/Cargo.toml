[package]
name = "apeiron-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.apeiron]
path = ".."

[[bin]]
name = "gguf_header"
path = "fuzz_targets/gguf_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gguf_open"
path = "fuzz_targets/gguf_open.rs"
test = false
doc = false
bench = false

[lints.clippy]
pedantic = "warn"
