# Public cut manifest. `release/cut.py` is the only reader.
# Everything not named in `strip` ships. A path ends in `/` for a directory, otherwise it is a file
# or a glob (`git filter-repo --path-glob` syntax).

# Removed from the tree and from every commit.
strip = [
  "docs/README.md",
  "docs/archive/",
  "docs/call-census/",
  "docs/direction.md",
  "docs/epics/",
  "docs/evidence/",
  "docs/hash-comparison.md",
  "docs/kernel-boundary.md",
  "docs/moved.tsv",
  "docs/plan.md",
  "docs/reviews/",
  "docs/rfcs/",
  "docs/roadmap.md",
  "docs/state-ledger.tsv",
  "docs/study/",
  "docs/templates/",
  "docs/contracts/artifacts.toml",
  "docs/contracts/commit-task-association.md",
  "docs/contracts/joint-*",
  "docs/contracts/kepler-*",
  "artifacts/",
  ".apeiron/",
  ".githooks/",
  "release/",
  "AGENTS.md",
  "tools/board/",
  "tools/call-census/",
  "tools/debt/",
  "tools/dispatch/",
  "tools/gate/",
  "tools/gpu/",
  "tools/hattn/",
  "tools/joint/",
  "tools/neural-adapt/",
  "tools/policy-oracle/",
  "tools/qwen35/",
  "tools/rooting/",
  "tools/hooks/",
  "tools/check-assurance.py",
  "tools/check-kepler.py",
  "tools/vendor-neural.sh",
  "proof/resource/",
  "proof/dispatch/",
  "proof/DispatchAdmission.lean",
  "proof/controls/",
  "proof/native/",
  "*__pycache__/*",
  "*.pyc",
  "*.olean",
  "*.ilean",
  "*/.lake/*",
  "target/",
]

# Applied to every blob in every commit (git filter-repo --replace-text syntax: literal, or
# `regex:PATTERN==>REPLACEMENT`).
text_map = [
  "https://gitlab.tas.twn.network/lucas/apeiron/-/blob/==>https://github.com/sanguinehost/apeiron/blob/",
  "git@gitlab.tas.twn.network:lucas/==>git@github.com:sanguinehost/",
  "projects.tas.twn.network==>projects.example.invalid",
  "gitlab.tas.twn.network==>git.example.invalid",
  "tas.twn.network==>example.invalid",
  "twn.systems==>example.invalid",
  "/home/socol/oc-tmp/==>~/",
  "/home/socol/Workspace/==>~/",
  "/home/socol/==>~/",
  "/home/socol==>~",
  "-home-socol-==>-home-user-",
  "oc-tmp==>scratch",
  "/tmp/opencode==>/tmp/apeiron",
  # A pointer to a stripped internal document keeps its slug and drops the path.
  "regex:`?docs/(?:(?:epics|evidence|reviews|study|rfcs|archive|call-census|templates)/|contracts/(?!slang-source-))([A-Za-z0-9_./-]*?[A-Za-z0-9_-])(?:\\.md)?(?::\\d+)?`?==>the unpublished \\1 note",
  "regex:`?docs/(?:epics|evidence|reviews|study|rfcs|archive|call-census|templates)/`?==>the unpublished notes",
  "regex:`?docs/(?:DESIGN|kernel-boundary|plan|roadmap|direction|README|hash-comparison|state-ledger|moved)(?:\\.(?:md|tsv))?`?==>the unpublished design notes",
  "regex:`?docs/references\\.bib`?==>the bibliography",
]

# Applied to every commit message.
message_map = [
  "regex:(?m)^board:.*\\n?==>",
  "regex:\\brel-apeiron-[a-z-]+-[A-Za-z0-9]{20,24}\\b==>",
  "regex:/home/socol/(?:oc-tmp/|Workspace/)?==>~/",
]

# `cut.py --check` fails when any of these matches a blob or a commit message of the cut.
forbidden = [
  "tas\\.twn",
  "twn\\.systems",
  "gitlab\\.tas",
  "/home/socol",
  "\\bsocol\\b",
  "oc-tmp",
  "(?i)operately",
  "OPERATELY_API",
  "\\brel-apeiron-[a-z-]+-[A-Za-z0-9]{20,24}\\b",
  "^board:",
  "/tmp/opencode",
  "\\bdocs/(?:(?:epics|evidence|reviews|study|rfcs|archive|call-census|templates)/|contracts/(?!slang-source-))",
  "\\bdocs/(?:plan|roadmap|DESIGN|kernel-boundary|direction|README|hash-comparison)\\.md",
  "[Aa]ntigravity",
  "\\bdeepseek\\b",
  "(?i)\\bhold overrides",
]

# Added after the filter, from `release/public/<path>` to `<path>`.
[substitute]
"AGENTS.md" = "release/public/AGENTS.md"
".githooks/pre-commit" = "release/public/.githooks/pre-commit"
".githooks/commit-msg" = "release/public/.githooks/commit-msg"
".githooks/pre-push" = "release/public/.githooks/pre-push"
"tools/hooks/install.sh" = "release/public/tools/hooks/install.sh"

# Files kept from the internal tree that the check reads for the public list.
[expect]
# Under docs/ only these globs may ship.
docs_allow = ["docs/contracts/slang-source-*.md"]
# Stripped prefixes the dangling-reference scan skips (ordinary words, or build output).
dangling_ignore = ["release/", "target/"]
# Files that must exist in the cut (the substitutions and the public surface).
present = [
  "README.md", "LICENSE", "NOTICE", "SECURITY.md", "CONTRIBUTING.md", "AGENTS.md",
  "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yml",
  ".githooks/pre-commit", ".githooks/commit-msg", ".githooks/pre-push",
  "tools/hooks/install.sh", "tools/check-claims.py", "tools/book-check.py", "tools/book-test.sh",
  "book/book.toml", "proof/README.md", "proof/regen.sh", "proof/canonical/lakefile.lean",
  "proof/corpus/lakefile.lean",
]
