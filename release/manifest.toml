# Applied to every blob in every commit (git filter-repo --replace-text syntax: literal, or
# `regex:PATTERN==>REPLACEMENT`).
text_map = [
  "https://gitlab.tas.twn.network/lucas/apeiron/-/blob/==>https://github.com/sanguinehost/apeiron/blob/",
  "git@gitlab.tas.twn.network:lucas/==>git@github.com:sanguinehost/",
  "projects.tas.twn.network==>projects.example.invalid",
  "gitlab.tas.twn.network==>git.example.invalid",
  "tas.twn.network==>example.invalid",
  "twn.systems==>example.invalid",
  # An agent session preflight recorded in Icarus Lean headers.
  "regex:(?s)Pre-flight\\s+repos/apeiron/tools/gate/target/debug/gate hold.*?no\\s+hold\\s+in\\s+force`[^.]*\\.\\s*==>",
  "/home/lucas/Workspace/icarus/repos/apeiron/==>",
  "/home/lucas/Workspace/icarus/bin/lane==>lane",
  "/home/lucas/Workspace/icarus/==>~/icarus/",
  "/home/lucas/Workspace/==>~/",
  "/home/lucas/==>~/",
  "/home/socol/oc-tmp/==>~/",
  "/home/socol/Workspace/==>~/",
  "/home/socol/==>~/",
  "/home/socol==>~",
  "-home-socol-==>-home-user-",
  "regex:(?m)^# Row: `rel-apeiron-[^\\n]*\\n==>",
  "regex:(?m)^Row: [a-z]+-apeiron-[^\\n]*\\n==>",
  # Task ids: a parenthetical holding only the id goes whole, a bare id goes alone.
  "regex: ?\\(`?APEIRON-[A-Z0-9]+(?:-[A-Za-z0-9]+)*`?\\)==>",
  "regex:`?\\bAPEIRON-[A-Z0-9]+(?:-[A-Za-z0-9]+)*\\b`?[;,]? ?==>",
  # Wave and task labels: a parenthetical holding only the label goes whole, a bare label alone.
  "regex: ?\\(W\\d+-[TA]\\d+[a-z]*\\)==>",
  "regex:\\bW\\d+-[TA]\\d+[a-z]*:? ?==>",
  "regex:\\bthe lead review\\b==>review",
  # Reviewer names in history; the current tree is edited at the source.
  "regex:\\b(?:Sol|Astra|Terra)\\b==>the reviewer",
  # The resource model directory is not published; a pointer into it keeps the file name.
  "regex:(?:~/apeiron/)?proof/resource/==>the unpublished resource model/",
  "oc-tmp==>scratch",
  # Experiment lane ids: the experiment keeps a plain name, the lane and task ids go.
  "regex: ?\\(`LEARN-HATTN`, task `HATTN-T(\\d+)`\\)==> (attention-cut T\\1)",
  "regex:`?escalation/FACES-R1-H5-PREDICTION\\.md`?==>the H5 prediction note",
  "regex:(?:~/)?\\bescalation/==>",
  "regex:\\bHATTN-T(\\d+)\\b==>attention-cut T\\1",
  "regex:\\bFACES-([A-Z]\\d+)\\b==>faces \\1",
  "/tmp/opencode==>/tmp/apeiron",
  # A pointer to a stripped internal document keeps its slug and drops the path.
  "regex:`?docs/(?:(?:epics|evidence|reviews|study|rfcs|archive|call-census|templates)/|contracts/(?!slang-source-))([A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*)(?:\\.md)?(?:#[A-Za-z0-9_-]+)?(?::\\d+)?`?==>the unpublished \\1 note",
  "regex:`?docs/(?:epics|evidence|reviews|study|rfcs|archive|call-census|templates)/`?==>the unpublished notes",
  "regex:`?docs/(?:DESIGN|kernel-boundary|plan|roadmap|direction|README|hash-comparison|state-ledger|moved)(?:\\.(?:md|tsv))?(?:#[A-Za-z0-9_-]+)?`?==>the unpublished design notes",
  "regex:`?docs/references\\.bib`?==>the bibliography",
]

# Applied to every commit message.
message_map = [
  "regex:(?m)^board:.*\\n?==>",
  "regex:\\brel-apeiron-[a-z-]+-[A-Za-z0-9]{20,24}\\b==>",
  "regex:/home/socol/(?:oc-tmp/|Workspace/)?==>~/",
  "regex:/home/(?!runner)[a-z]+\\b==>~",
  "regex:(?:~/)?\\bescalation/==>",
]

# `cut.py --check` fails when any of these matches a blob or a commit message of the cut.
forbidden = [
  "tas\\.twn",
  "twn\\.systems",
  "gitlab\\.tas",
  "/home/socol",
  "/home/(?!runner)[a-z]+",
  "\\bsocol\\b",
  "oc-tmp",
  "(?i)operately",
  "OPERATELY_API",
  "\\brel-apeiron-[a-z-]+-[A-Za-z0-9]{20,24}\\b",
  "^board:",
  "/tmp/opencode",
  "\\bdocs/(?:(?:epics|evidence|reviews|study|rfcs|archive|call-census|templates)/|contracts/(?!slang-source-)\\w)",
  "\\bdocs/(?:plan|roadmap|DESIGN|kernel-boundary|direction|README|hash-comparison)\\.md",
  "[Aa]ntigravity",
  "\\bdeepseek\\b",
  "(?i)\\bhold overrides",
  "\\bAPEIRON-[A-Z]",
  "\\bW\\d+-[TA]\\d+",
  "(?i)\\blead review",
  "-apeiron-[a-z0-9-]+-(?=[A-Za-z0-9]*[A-Z0-9])[A-Za-z0-9]{20,24}\\b",
  "\\b(?:Sol|Astra|Terra)\\b",
  "\\bHATTN-",
  "\\bFACES-[A-Z]",
  "LEARN-HATTN",
  "\\bescalation/",
]

# Every author and committer in the cut's history is rewritten to `name <email>`; `check` fails on any other.
[authors]
name = "Lucas 'Paperboy' Rose-Winters"
email = "lucas@sanguinehost.com"
aliases = [
  "apeiron-lead <lead@apeiron.local>",
  "apeiron-worker <worker@apeiron.local>",
  "Icarus <icarus@local>",
  "Lucas 'Paperboy' Rose-Winters <lucasrosewinters@gmail.com>",
]

# Added after the filter, from `release/public/<path>` to `<path>`.
[substitute]
"AGENTS.md" = "release/public/AGENTS.md"
".githooks/pre-commit" = "release/public/.githooks/pre-commit"
".githooks/commit-msg" = "release/public/.githooks/commit-msg"
".githooks/pre-push" = "release/public/.githooks/pre-push"
"tools/hooks/install.sh" = "release/public/tools/hooks/install.sh"

# Files kept from the internal tree that the check reads for the public list.
[expect]
# Under docs/ only these globs may ship.
docs_allow = []
# Stripped prefixes the dangling-reference scan skips (ordinary words, or build output).
# Public-facing documents that must read without any rewritten pointer: the cut fails when one
# contains "unpublished", so the source is edited instead.
public_docs = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "proof/README.md", "book/src/"]
dangling_ignore = ["release/", "target/"]
# Paths whose abbreviated commit ids are rewritten to the ids of the cut's history.
remap = ["README.md", "proof/README.md", "bench/", "book/src/", "src/freq.rs", "src/hashtrinity/mod.rs"]
# Files that must exist in the cut (the substitutions and the public surface).
present = [
  "README.md", "LICENSE", "NOTICE", "SECURITY.md", "CONTRIBUTING.md", "AGENTS.md",
  "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yml",
  ".githooks/pre-commit", ".githooks/commit-msg", ".githooks/pre-push",
  "tools/hooks/install.sh", "tools/check-claims.py", "tools/book-check.py", "tools/book-test.sh",
  "tools/check-provenance.py", "tools/provenance.toml", "book/book.toml", "proof/README.md", "proof/regen.sh", "proof/canonical/lakefile.lean",
  "proof/corpus/lakefile.lean",
]
