[package]
name = "apeiron-wasm"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "wasm-bindgen ABI over apeiron's own Q32.32 inference engine."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apeiron = { path = ".." }

# Target-gated so the host workspace build and `cargo test --workspace` never link the wasm glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
