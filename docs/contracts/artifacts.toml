# Artefact registry for `tools/gate`. Owned by the E1 wave table in `docs/plan.md`; a document a
# gate parses lives in `docs/contracts/` and is edited under a task, never by a worker.
#
# Schema. One `[[artifact]]` table per row, seven required keys, no defaults:
#
#   id       stable and unique; a repeated id is refused before any payload is compared, because
#            no identity in a manifest that registers one id twice is authoritative
#   kind     one of: gate | receipt | doc | lean | rust
#   path     repo-relative; a file or a directory
#   sha256   64 lowercase hex digits, no `sha256:` prefix, of `path`:
#              file      the sha256 of its bytes
#              directory the sha256 of the concatenation, in ascending repo-relative path order, of
#                       one `<hex>  <repo-relative path>\n` line per contained file; path components
#                       beginning with `.` and the component `target` are skipped, so build products
#                       and editor scratch do not enter an identity
#   gate     the exact command that checks this artefact, run from the repository root
#   control  the exact command that exercises the rejecting path, or "" when the artefact exposes
#            none. A control is a command that must itself require a refusal: the `*_gate.py`
#            controls mutate the real source, require the proof to go red with an attributable
#            diagnostic, restore it, and exit 0 only if all three happened
#   budget_s wall-clock seconds the gate may take; 1..=600, since AGENTS.md section 10 fails any
#            local invocation that reaches ten minutes
#
# What `gate docs check` does and does not establish. It loads this file through
# `tools/gate/adapter.rs`, hashes each `path` and asks `tools/gate/core.rs` whether the recorded
# identity still describes the tree. It reports the rows loaded, a repeated id and a drifted
# digest. It does not run the `gate` or `control` column: a column here records the command a row
# must be checked with, and whether that command currently exits 0 is a separate claim owned by
# the wave that runs it. The digests below were produced by this same loader, not by a second
# implementation, and they bind to the bytes on disk when it last reported clean.
#
# What a run records. The adapter runs a row's `gate` command through `/bin/sh -c` under that row's
# `budget_s` and returns one record: the command string, the working directory, the exit status,
# whether it was killed at the budget, the elapsed milliseconds, and the sha256 of its stdout and of
# its stderr. The two refusals it carries are a command that could not be run at all, and a child
# killed at its budget; the second refuses because a killed gate reported nothing, and reading its
# silence as a pass is the quiet success `AGENTS.md` §10 records. A non-zero exit is not a refusal —
# it is the child's own verdict, carried by the exit status.
#
# Seeded rows: `docs/plan.md`, `tools/gate/`, and the 36 `proof/resource/*_gate.py` (30 tracked,
# 6 untracked: KvAppend, LmHead, Matvec, RegenRelocateAll, RegenRelocateEntry, RowDotAdmission).
# `RegenRelocateEntry_gate.py` exposes no `--check` flag, so its `gate` column carries the bare
# command. No `gate` or `control` column here has been executed: the columns record the command each
# row must be checked with, and running them is the owning wave's evidence.
#
# The `tools/gate` row hashes a directory, so it re-reports a drift whenever a sibling wave adds or
# changes a file in that crate. That is the identity working, not a defect: the wave that writes the
# file refreshes this row in the same task. `docs/plan.md` and the gate scripts are single files and
# drift only when their own bytes change.
#
# The `control` column of the `tools/gate` row chains one filtered run per refusing path, so each
# filter names the control that must require a refusal. The supporting controls — the streaming
# digest against the one-shot digest, the relay across its buffer boundary, an unrunnable command,
# the attributable digest-mismatch diagnostic, an exclusive lock, a malformed registry — are run by
# the same `cargo test` and are asserted by name in `tools/gate/{adapter.rs,main.rs}`.

