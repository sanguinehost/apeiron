# The final tree of the apeiron repository (owner direction 2026-10-15: decide the final folder and file structure
# and enforce it). Read by `tools/gate structure` (docs/plan.md, STRUCT-GATE). Lead verdict, listed for owner review.
#
# Admission: a tracked path is admitted by the [[dir]] whose `path` is its parent directory, or by the nearest
# ancestor [[dir]] with `recursive = true`. Its file name must match one of that entry's `files` globs (`*` matches
# any run of characters except `/`). A path admitted by no entry is refused; a directory gains a place in the tree
# only by an edit to this file.
#
# Limits apply to source files (extensions in `source`): at most `max_lines` physical lines per file and at most
# `max_dir_files` source files directly in one directory (AGENTS.md section 4). `generated` paths are exempt from
# `max_lines`. Python is admitted only at a path listed in [python].frozen; the list only shrinks, and an entry that
# is no longer tracked is refused, so a deletion must also delete its entry.
#
# [[debt]] records a violation present when this file was written: rule, path, and the board row that removes it.
# A debt entry whose violation no longer holds is refused, so the list only shrinks.

schema = 1
max_lines = 1500
max_dir_files = 12
source = ["rs", "lean", "comp", "py", "sh", "c", "cpp"]
generated = ["proof/ApeironWord.lean"]

