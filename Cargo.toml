[package]
name = "apeiron"
version = "0.1.0"
edition = "2021"
description = "The two-slot algebra R[x]/(x^2 - sigma), and the table that falls out of it."
readme = "README.md"
authors = ["Lucas 'Paperboy' Rose-Winters"]
license = "Apache-2.0"
keywords = ["hashmap", "hash", "algebra", "deterministic", "hashdos"]
categories = ["data-structures", "algorithms", "concurrency"]
# 1.89 stabilised the AVX-512 and AVX-VNNI target features, so `is_x86_feature_detected!("avxvnni")`
# in the engine kernels compiles. `cargo +1.87 check --lib` fails on it (E0658); `cargo +1.89.0
# check --lib --locked` passes.
rust-version = "1.89"

[features]
# Off by default, so the ordinary build of this crate still has **zero** dependencies. Turning it
# on pulls syn/quote/proc-macro2 in as build-time-only deps of the derive crate.
derive = ["dep:apeiron-derive"]
# Off by default. Enables the read-path attribution counters (`apeiron::table::read_stats`), which
# use a `thread_local` and therefore must not enter the Charon/Aeneas extraction unit; the extraction
# runs a debug profile (so `debug_assertions` is on), which is why they are gated by this feature and
# not by `debug_assertions`. The timed release path is counter-free with or without it.
read-stats = []
# Off by default. The sovereign GPU runtime (`src/gpu`): dlopen Vulkan device + dispatch over the
# always-on `spirv::simt` kernel builders. Zero crates; the unsafe FFI is the boundary.
gpu = []
# Off by default. Enables the test-only one-shot seams and observation probes
# (`apeiron::coord::locator::reservation_failure` and the injection-gated seams/probes in
# `apeiron::table::parallel` and `apeiron::table::locator`), which use a `thread_local` and
# therefore must stay off in the Charon/Aeneas extraction unit (Charon builds with default
# features). With it off, the default build contains no `thread_local` and no seam call; the real
# `SizeOverflow`, `AllocationFailed` and `Capacity` refusal paths are unaffected.
injection = []

[dependencies]
apeiron-derive = { path = "derive", version = "0.1.0", optional = true }

# The `hashtrinity` git dependency (the REG-1 incumbent) is removed. The count face's executed body
# is the in-tree port (`src/map/hashtrinity/`, re-exported through `src/map/freq.rs`); the external crate was
# the comparison baseline and nothing under `src/` imports it.

# Thread affinity for the Q8Act worker pool (`src/engine/chart/pool.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The REG-1 comparison dev-dependencies (criterion, hashbrown, foldhash, fxhash, rayon, rustc-hash,
# twox-hash, wyhash, ahash, fnv), the harness-only `libc` (its consumer `examples/support/counter.rs`
# is gone) and the `hashtrinity` baseline are removed with the comparison harness. `blake3`/`sha2`
# are the reference oracles for the crypto module's tests (`src/map/hashtrinity/crypto.rs`) and the
# bench/example digests.
blake3 = "=1.8.7"
sha2 = "=0.10.9"

[workspace]
members = ["derive", "fold-abi"]
# `fuzz` builds under a sanitizer with its own flags and its own lockfile; it is a sibling
# project, not a member of this one.
exclude = ["fuzz"]

# Pedantic is on. Most of what it flags in this crate is numeric casts, and numeric casts are
# exactly what this code does -- which is the argument for the lint rather than against it: a cast
# that is safe by construction should have to say so, and one that is not should be found.
#
# `[lints]` rather than `#![warn]` in `lib.rs` so it reaches every target in the package. The
# examples and benches are measurement harnesses and they are held to it too; a benchmark that
# reports a wrong number because a cast lost precision is worse than one that does not compile.
[lints.clippy]
pedantic = "warn"
