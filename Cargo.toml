[package]
name = "apeiron"
version = "0.1.0"
edition = "2021"
description = "The two-slot algebra R[x]/(x^2 - sigma), and the table that falls out of it."
readme = "README.md"
authors = ["Lucas 'Paperboy' Rose-Winters"]
license = "MPL-2.0"
keywords = ["hashmap", "hash", "algebra", "deterministic", "hashdos"]
categories = ["data-structures", "algorithms", "concurrency"]
# 1.87 is where `i32::cast_unsigned` and its siblings stabilised (`integer_sign_cast`). `coord`
# uses them to say "reinterpret the sign bit" in the type system rather than in a comment over a
# suppressed lint, which is worth a floor. `#[expect]`, the other modern thing here, is 1.81.
rust-version = "1.87"

[features]
# Off by default, so the ordinary build of this crate still has **zero** dependencies. Turning it
# on pulls syn/quote/proc-macro2 in as build-time-only deps of the derive crate.
derive = ["dep:apeiron-derive"]
# Off by default. Enables the read-path attribution counters (`apeiron::table::read_stats`), which
# use a `thread_local` and therefore must not enter the Charon/Aeneas extraction unit; the extraction
# runs a debug profile (so `debug_assertions` is on), which is why they are gated by this feature and
# not by `debug_assertions`. The timed release path is counter-free with or without it.
read-stats = []
# Off by default. The sovereign GPU runtime (`src/gpu`): dlopen Vulkan device + dispatch over the
# always-on `spirv::simt` kernel builders. Zero crates; the unsafe FFI is the boundary.
gpu = []
# Off by default. Enables the test-only one-shot seams and observation probes
# (`apeiron::coord::locator::reservation_failure` and the injection-gated seams/probes in
# `apeiron::table::parallel` and `apeiron::table::locator`), which use a `thread_local` and
# therefore must stay off in the Charon/Aeneas extraction unit (Charon builds with default
# features). With it off, the default build contains no `thread_local` and no seam call; the real
# `SizeOverflow`, `AllocationFailed` and `Capacity` refusal paths are unaffected.
injection = []

[dependencies]
apeiron-derive = { path = "derive", version = "0.1.0", optional = true }

# REG-1 load-bearing incumbent on the **library** build path: `hashtrinity::FreqMap` is the measured
# counting structure (the NB face), fetched from the local fold Git object at a committed revision.
# A `file://` clone reads committed objects only, so a dirty fold working tree cannot leak in. The
# crate's unconditional `crypto` module imports its `hex` and `base64` masquerade modules, so those
# two are the minimum set that compiles; the default `rustls-provider`/`webauthn`/`syncfold`
# features stay off.
[dependencies.hashtrinity]
git = "file://~/fold"
rev = "4cc14471ae24f3f204fb0b0e91736ef75c909358"
default-features = false
features = ["hex", "base64"]

# Thread affinity for the Q8Act worker pool (`src/engine/chart/pool.rs`); already in the lock via
# the dev-dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# REG-1 load-bearing incumbents. hashbrown's `default-hasher` is foldhash and its `rayon` feature
# exposes `HashMap::par_iter`; the `fxhash` crate supplies `FxBuildHasher` (hashbrown 0.15 has no
# fxhash feature). Exact `=` pins keep the comparison identity reproducible; `hashtrinity` is
# pinned by revision below.
hashbrown = { version = "0.15", features = ["default-hasher", "rayon"] }
foldhash = "0.1"
fxhash = "=0.2.1"
rayon = "=1.12.0"
rustc-hash = "2"
# REG-1 informational comparators. `examples/reg1/acceptance.rs` registers each as
# `PairClass::Informational`, so they are reported and excluded from the load-bearing pass. Exact
# `=` pins keep the measured identity reproducible. `twox-hash` is the xxHash binding; the XXH3-64
# and XXH64 `Hasher`s are behind the `xxhash3_64` and `xxhash64` features. Defaults are off to drop
# the unused xxhash32/xxhash3_128/`random` surface.
twox-hash = { version = "=2.1.4", default-features = false, features = ["xxhash3_64", "xxhash64"] }
wyhash = "=0.6.0"
ahash = "=0.8.12"
fnv = "=1.0.7"
blake3 = "=1.8.7"
sha2 = "=0.10.9"
# Harness-only: `perf_event_open` and `ioctl` for `examples/support/counter.rs`, so a benchmark
# row carries its own instruction count instead of trusting a wall clock. A dev-dependency, so the
# published crate still has zero dependencies.
libc = "0.2"

# Harness-only REG-1 baseline: the pinned historical `hashtrinity::Table`, fetched from the local
# fold Git object at a committed revision. A `file://` clone reads committed objects only, so a
# dirty fold working tree cannot leak in. The crate's unconditional `crypto` module imports its
# `hex` and `base64` masquerade modules, so those two are the minimum set that compiles; the
# default `rustls-provider`/`webauthn`/`syncfold` features stay off.
[dev-dependencies.hashtrinity]
git = "file://~/fold"
rev = "4cc14471ae24f3f204fb0b0e91736ef75c909358"
default-features = false
features = ["hex", "base64"]

# Examples are grouped by kind under `examples/`, so their target paths are declared here rather
# than auto-discovered from the directory root. Names are unchanged, so every `cargo run --example
# <name>` invocation keeps working.
[[example]]
name = "avalanche"
path = "examples/smhasher/avalanche.rs"

[[example]]
name = "avalanche_bias"
path = "examples/smhasher/avalanche_bias.rs"

[[example]]
name = "collision_survey"
path = "examples/smhasher/collision_survey.rs"

[[example]]
name = "diffdist"
path = "examples/smhasher/diffdist.rs"

[[example]]
name = "lowbits_probe"
path = "examples/smhasher/lowbits_probe.rs"

[[example]]
name = "moment_chi2"
path = "examples/smhasher/moment_chi2.rs"

[[example]]
name = "perlin"
path = "examples/smhasher/perlin.rs"

[[example]]
name = "sparse_keys"
path = "examples/smhasher/sparse_keys.rs"

[[example]]
name = "top_bit"
path = "examples/smhasher/top_bit.rs"

[[example]]
name = "addr_latency"
path = "examples/fold/addr_latency.rs"

[[example]]
name = "context_keys"
path = "examples/fold/context_keys.rs"

[[example]]
name = "hash_only"
path = "examples/fold/hash_only.rs"

[[example]]
name = "length_sweep"
path = "examples/fold/length_sweep.rs"

[[example]]
name = "rolling_key"
path = "examples/fold/rolling_key.rs"

[[example]]
name = "why_slower"
path = "examples/fold/why_slower.rs"

[[example]]
name = "table_cost_probe"
path = "examples/table_cost_probe.rs"

[[example]]
name = "spill_read_probe"
path = "examples/spill_read_probe.rs"

[[example]]
name = "counter_check"
path = "examples/support/counter_check.rs"

[[example]]
name = "reg1"
path = "examples/reg1/main.rs"

# The ported SIMT kernels' GPU gates (need the `gpu` runtime feature).
[[example]]
name = "simt_check"
path = "examples/simt_check.rs"
required-features = ["gpu"]

[[example]]
name = "simt_gemv"
path = "examples/simt_gemv.rs"
required-features = ["gpu"]

# Matched-shape batch-tiled DP4A GEMM measurement (the CUDA MMQ comparator's shapes/tokens).
[[example]]
name = "simt_batch"
path = "examples/simt_batch.rs"
required-features = ["gpu"]

[workspace]
members = ["derive", "fold-abi"]
# `fuzz` builds under a sanitizer with its own flags and its own lockfile; it is a sibling
# project, not a member of this one.
exclude = ["fuzz"]

# Pedantic is on. Most of what it flags in this crate is numeric casts, and numeric casts are
# exactly what this code does -- which is the argument for the lint rather than against it: a cast
# that is safe by construction should have to say so, and one that is not should be found.
#
# `[lints]` rather than `#![warn]` in `lib.rs` so it reaches every target in the package. The
# examples and benches are measurement harnesses and they are held to it too; a benchmark that
# reports a wrong number because a cast lost precision is worse than one that does not compile.
[lints.clippy]
pedantic = "warn"
