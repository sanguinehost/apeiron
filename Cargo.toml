[package]
name = "apeiron"
version = "0.1.0"
edition = "2021"
description = "The two-slot algebra R[x]/(x^2 - sigma), and the table that falls out of it."
readme = "README.md"
authors = ["Lucas 'Paperboy' Rose-Winters"]
license = "Apache-2.0"
keywords = ["hashmap", "hash", "algebra", "deterministic", "hashdos"]
categories = ["data-structures", "algorithms", "concurrency"]
# 1.87 is where `i32::cast_unsigned` and its siblings stabilised (`integer_sign_cast`). `coord`
# uses them to say "reinterpret the sign bit" in the type system rather than in a comment over a
# suppressed lint, which is worth a floor. `#[expect]`, the other modern thing here, is 1.81.
rust-version = "1.87"

[features]
# Off by default, so the ordinary build of this crate still has **zero** dependencies. Turning it
# on pulls syn/quote/proc-macro2 in as build-time-only deps of the derive crate.
derive = ["dep:apeiron-derive"]
# Off by default. Enables the read-path attribution counters (`apeiron::table::read_stats`), which
# use a `thread_local` and therefore must not enter the Charon/Aeneas extraction unit; the extraction
# runs a debug profile (so `debug_assertions` is on), which is why they are gated by this feature and
# not by `debug_assertions`. The timed release path is counter-free with or without it.
read-stats = []
# Off by default. The sovereign GPU runtime (`src/gpu`): dlopen Vulkan device + dispatch over the
# always-on `spirv::simt` kernel builders. Zero crates; the unsafe FFI is the boundary.
gpu = []
# Off by default. Enables the test-only one-shot seams and observation probes
# (`apeiron::coord::locator::reservation_failure` and the injection-gated seams/probes in
# `apeiron::table::parallel` and `apeiron::table::locator`), which use a `thread_local` and
# therefore must stay off in the Charon/Aeneas extraction unit (Charon builds with default
# features). With it off, the default build contains no `thread_local` and no seam call; the real
# `SizeOverflow`, `AllocationFailed` and `Capacity` refusal paths are unaffected.
injection = []

[dependencies]
apeiron-derive = { path = "derive", version = "0.1.0", optional = true }

# The `hashtrinity` git dependency (the REG-1 incumbent) is removed. The count face's executed body
# is the in-tree port (`src/hashtrinity/`, re-exported through `src/freq.rs`); the external crate was
# the comparison baseline and nothing under `src/` imports it (owner direction, 2026-10-05: no
# comparison to hashtrinity outside the HashDOS lane).

# Thread affinity for the Q8Act worker pool (`src/engine/chart/pool.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The REG-1 comparison dev-dependencies (criterion, hashbrown, foldhash, fxhash, rayon, rustc-hash,
# twox-hash, wyhash, ahash, fnv), the harness-only `libc` (its consumer `examples/support/counter.rs`
# is gone) and the `hashtrinity` baseline are removed with the comparison harness (owner direction,
# 2026-10-05). `blake3`/`sha2` stay for the vendored crypto/sha bodies until those modules leave with
# the port trim.
blake3 = "=1.8.7"
sha2 = "=0.10.9"
hashbrown = "=0.15.5"
rustc-hash = "=2.1.3"
twox-hash = { version = "=2.1.4", default-features = false, features = ["xxhash3_64", "xxhash64"] }

[[bench]]
name = "map"
harness = false

[[bench]]
name = "count"
harness = false

# Examples are grouped by kind under `examples/`, so their target paths are declared here rather
# than auto-discovered from the directory root. The comparison examples (smhasher, fold, the cost
# probes, support, reg1) are removed with the comparison harness (owner direction, 2026-10-05).

# The ported SIMT kernels' GPU gates (need the `gpu` runtime feature).
[[example]]
name = "simt_check"
path = "examples/simt_check.rs"
required-features = ["gpu"]

[[example]]
name = "simt_gemv"
path = "examples/simt_gemv.rs"
required-features = ["gpu"]

# Matched-shape batch-tiled DP4A GEMM measurement (the CUDA MMQ comparator's shapes/tokens).
[[example]]
name = "simt_batch"
path = "examples/simt_batch.rs"
required-features = ["gpu"]

# Whole-model GPU decode throughput (the llama-bench `tg` comparator).
[[example]]
name = "gpu_decode_bench"
path = "examples/gpu_decode_bench.rs"
required-features = ["gpu"]

[[example]]
name = "gemm_bench"
path = "examples/gemm_bench.rs"
required-features = ["gpu"]

# Whole-model GPU perplexity measurement (the llama-perplexity comparator).
[[example]]
name = "gpu_ppl"
path = "examples/gpu_ppl.rs"
required-features = ["gpu"]

[workspace]
members = ["derive", "fold-abi"]
# `fuzz` builds under a sanitizer with its own flags and its own lockfile; it is a sibling
# project, not a member of this one.
exclude = ["fuzz"]

# Pedantic is on. Most of what it flags in this crate is numeric casts, and numeric casts are
# exactly what this code does -- which is the argument for the lint rather than against it: a cast
# that is safe by construction should have to say so, and one that is not should be found.
#
# `[lints]` rather than `#![warn]` in `lib.rs` so it reaches every target in the package. The
# examples and benches are measurement harnesses and they are held to it too; a benchmark that
# reports a wrong number because a cast lost precision is worse than one that does not compile.
[lints.clippy]
pedantic = "warn"

# The vendored `src/hashtrinity/` tree is a *module* of this crate, so every `#[cfg(feature = …)]`
# in it resolves against **this** package's feature table. Its upstream feature names are renamed
# to an `ht-` prefix in `src/hashtrinity/mod.rs` so none of them can collide with — or be switched
# on by — one of ours (`derive` was the live collision: apeiron's own `derive` feature turned
# upstream's `ht-derive` surface on, and its `hashtrinity_derive` import then failed).
#
# The `ht-*` names are declared here, and not as `[features]` entries on purpose: declaring them as
# features would make `--all-features` turn the whole vendored surface **on**, pulling in external
# crates this crate does not depend on. Declaring the *expected cfg values* keeps every remaining
# gate a real, off-by-default gate, and keeps `unexpected_cfgs` at `warn` (so `-D warnings` still
# fails on any cfg name not listed here). Only `ht-codec`/`ht-compress`/`ht-derive`/`ht-syntax`
# remain referenced, by the retained `codec` and `hex` modules.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("ht-codec", "ht-compress", "ht-derive", "ht-syntax"))',
] }
