# GitHub Actions CI workflow for the public release of apeiron.
# Repository: github.com/sanguinehost/apeiron
#
# The `proof` job rebuilds the pinned Aeneas/Charon toolchain (`proof/bootstrap.sh`), checks the
# committed extraction against the source (`proof/regen.sh --check`) and builds the Lean bridge
# (`cd proof/corpus && lake build`) over the in-tree canonical corpus `proof/canonical/`. Its OCaml
# closure is `proof/opam-switch.export`; elan is fetched by digest.
#
# Toolchain pinning: `nightly-2026-04-14` (`rustc 1.97.0-nightly (17584a181 2026-04-13)`), the
# compiler the benchmark receipts were measured with. `src/` uses stable features only
# (`rust-version = "1.89"` in `Cargo.toml`); the pin keeps `clippy -D warnings` from drifting with
# newer lints.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-04-14
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-04-14
          components: clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-04-14

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run CPU unit tests
        # The hosted runner has no Vulkan device or glslc, and several integration binaries carry
        # workstation-scale fixtures. Run the unit suite here; clippy still compiles every feature,
        # including gpu. A GPU workstation runs --all-features and the integration binaries.
        run: cargo test --workspace --lib --locked --features derive,read-stats,injection -- --skip spirv_is_the_glsl

  structure:
    name: Tree structure (the tree note.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-04-14

      - name: Placement, size and Lean orphans when tools/gate is present
        # The public tree does not ship tools/gate; internal branches that carry it run the same
        # structure check. Keeping the job preserves the required check name.
        run: |
          if [ ! -f tools/gate/Cargo.toml ]; then
            echo "tools/gate is not in the public tree; no structure gate to run"
            exit 0
          fi
          cargo test --locked --manifest-path tools/gate/Cargo.toml
          git ls-files > "$RUNNER_TEMP/files"
          cargo run --release --locked --quiet --manifest-path tools/gate/Cargo.toml -- \
            structure --check --root . --files "$RUNNER_TEMP/files"

  claims:
    name: Claims and citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Claim checker controls
        run: python3 tools/check-claims.py --self-test

      - name: Every graded claim names a resolvable artifact
        run: python3 tools/check-claims.py

      - name: Provenance controls
        run: python3 tools/check-provenance.py --self-test

      - name: Ported files and unstated origins are named
        run: python3 tools/check-provenance.py

      - name: Book statements
        run: python3 tools/book-check.py

  proof:
    name: Proof (extraction + Lean)
    # The canonical toolchain digests are binutils-version-sensitive at the strip step. They were
    # measured with GNU binutils 2.46 (Ubuntu 26.04); 24.04's 2.42 produces a different digest.
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      APEIRON_OPAMROOT: /tmp/apeiron-opam
      APEIRON_AENEAS_BUILD_ROOT: /home/runner/aeneas-build
      ELAN_VERSION: v4.2.3
      ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends opam libgmp-dev pkg-config binutils bubblewrap

      - name: Canonical strip version
        run: |
          version=$(strip --version | sed -n '1s/.*) //p')
          case "$version" in
            2.46*) echo "strip $version" ;;
            *) echo "proof canonical identity requires binutils strip 2.46; found ${version:-unknown}" >&2; exit 1 ;;
          esac

      - name: Cache opam root and Aeneas build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.APEIRON_OPAMROOT }}
            ${{ env.APEIRON_AENEAS_BUILD_ROOT }}
          key: ${{ runner.os }}-ubuntu-26.04-aeneas-${{ hashFiles('proof/opam-switch.export', 'proof/patches/PINS', 'proof/bootstrap.sh') }}

      - name: OCaml closure (pinned switch export)
        run: |
          if [ ! -d "$APEIRON_OPAMROOT/default" ]; then
            opam init --bare --disable-sandboxing --no-setup --yes --root "$APEIRON_OPAMROOT"
            opam switch import proof/opam-switch.export --switch default --root "$APEIRON_OPAMROOT" --yes
          fi

      - name: Install elan (pinned digest)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tgz" "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Aeneas and Charon (pinned, stripped digests)
        run: proof/bootstrap.sh --step-timeout 3000

      - name: Extraction is fresh
        run: proof/regen.sh --check

      - name: Lean bridge (Mathlib cache, then build)
        working-directory: proof/corpus
        run: |
          lake exe cache get
          lake build
