# GitHub Actions CI workflow for the public release of apeiron.
# Repository: github.com/sanguinehost/apeiron
#
# The `proof` job rebuilds the pinned Aeneas/Charon toolchain (`proof/bootstrap.sh`), checks the
# committed extraction against the source (`proof/regen.sh --check`) and builds the Lean bridge
# (`cd proof/corpus && lake build`) over the in-tree canonical corpus `proof/canonical/`. Its OCaml
# closure is `proof/opam-switch.export`; elan is fetched by digest.
#
# Toolchain pinning rationale:
#   Pinned to `nightly-2026-04-14`, which provides `rustc 1.97.0-nightly (17584a181 2026-04-13)`
#   and `cargo 1.97.0-nightly (eb94155a9 2026-04-09)`. This matches the exact compiler identity
#   recorded across all perf ledgers, epics, and benchmark baselines in the repository.
#   While `Cargo.toml` sets `rust-version = "1.87"` as the language MSRV floor, apeiron uses
#   nightly compiler features, inline assembly, AVX2 intrinsics, and pedantic clippy lints
#   (`-D warnings`), requiring an exact compiler pin to prevent CI drift from newer lints.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
          components: clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Without a physical GPU / Vulkan ICD, all GPU tests in apeiron::gpu must skip cleanly.
      VK_ICD_FILENAMES: /nonexistent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly-2026-04-14)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  gates:
    name: Rooting & Document Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read gate check (§1 reading order)
        run: python3 tools/rooting/read_gate.py (unpublished) --check

      - name: Doc reachability check (§10 doc reachability)
        run: python3 tools/rooting/doc_reach.py (unpublished) --check

      - name: Retire check (§10 retired routes)
        run: python3 tools/rooting/retire_check.py (unpublished) --check

      - name: Check claims self-test (11/11 controls)
        run: python3 tools/check-claims.py --self-test

      # The full `tools/check-claims.py` resolves claims against the Lean corpus under
      # proof/corpus/.lake, which a fresh clone does not have until the TOOL-IDENTITY bootstrap
      # lands. It is NOT run here rather than run with continue-on-error: a step that cannot fail
      # is not a gate (AGENTS.md §10). The pre-commit hook runs it on every local commit.

  proof:
    name: Proof (extraction + Lean)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      APEIRON_OPAMROOT: /tmp/apeiron-opam
      APEIRON_AENEAS_BUILD_ROOT: /home/runner/aeneas-build
      ELAN_VERSION: v4.2.3
      ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends opam libgmp-dev pkg-config binutils bubblewrap

      - name: Cache opam root and Aeneas build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APEIRON_OPAMROOT }}
            ${{ env.APEIRON_AENEAS_BUILD_ROOT }}
          key: ${{ runner.os }}-aeneas-${{ hashFiles('proof/opam-switch.export', 'proof/patches/PINS', 'proof/bootstrap.sh') }}

      - name: OCaml closure (pinned switch export)
        run: |
          if [ ! -d "$APEIRON_OPAMROOT/default" ]; then
            opam init --bare --disable-sandboxing --no-setup --yes --root "$APEIRON_OPAMROOT"
            opam switch import proof/opam-switch.export --switch default --root "$APEIRON_OPAMROOT" --yes
          fi

      - name: Install elan (pinned digest)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tgz" "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Aeneas and Charon (pinned, stripped digests)
        run: proof/bootstrap.sh --step-timeout 3000

      - name: Extraction is fresh
        run: proof/regen.sh --check

      - name: Lean bridge (Mathlib cache, then build)
        working-directory: proof/corpus
        run: |
          lake exe cache get
          lake build
