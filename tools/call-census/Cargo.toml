[package]
name = "call-census"
version = "0.2.0"
edition = "2021"
description = "Reproducible AST-based Rust call-site census for Hashtrinity/apeiron consumers."
license = "MPL-2.0"
publish = false

# This tool lives inside the apeiron repository tree but is deliberately its own
# workspace root so that it never becomes a member of the apeiron workspace and
# never needs an edit to apeiron/Cargo.toml. Delete this table and the crate is
# absorbed by the parent workspace.
[workspace]

[[bin]]
name = "call-census"
path = "src/main.rs"

[lib]
name = "call_census"
path = "src/lib.rs"

[dependencies]
# Versions are pinned to crates already present in the local registry cache so
# the tool builds with `cargo build --offline`; bump deliberately, not by `cargo
# update`.
syn = { version = "=2.0.119", features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
walkdir = "=2.5.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
