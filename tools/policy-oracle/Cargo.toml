[package]
name = "policy-oracle"
version = "0.0.0"
edition = "2021"
description = "Cedar differential oracle over the real apeiron::policy::decide (APEIRON-POLICY-W2-T2)."
license = "MPL-2.0"
publish = false

# This tool lives inside the apeiron repository tree but is deliberately its own workspace root
# so that it never becomes a member of the apeiron workspace and never needs an edit to
# apeiron/Cargo.toml. Delete this table and the crate is absorbed by the parent workspace.
[workspace]

[[bin]]
name = "policy-oracle"
path = "src/main.rs"

[dependencies]
apeiron = { path = "../.." }
cedar-policy = "=4.13.0"
serde_json = "=1.0.151"
